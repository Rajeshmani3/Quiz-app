<html lang="en">
<head>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
       <header class="header">
          <div class="logo">
            <span class="img-logo"><img src="assets/image/logo.webp" alt="quiz-logo" width="30" height="30">  </span>

<span >
